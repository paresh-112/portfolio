[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# /api/chat and /chat are routed by netlify/functions/chat.mjs via its own
# `config.path` export, so they need no redirect here.

[[redirects]]
  from = "/api/transcribe"
  to = "/.netlify/functions/transcribe"
  status = 200
